[project]
name = "aegis"
version = "0.1.0"
description = "Adaptive Environment Graph Identification System"
requires-python = ">=3.11"
dependencies = [
    # Core ML
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=2.0",
    "einops>=0.8",
    # Vision / geometry
    "opencv-python>=4.13",
    "pillow>=11.0",
    "scipy>=1.15",
    "scikit-learn>=1.8",
    # Data / utilities
    "tqdm>=4.67",
    "matplotlib>=3.10",
    "pandas>=2.3",
    "pycocotools>=2.0.11",
    "pydantic>=2.12",
    "yacs>=0.1.8",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
# Training pipeline (SegMASt3R fine-tuning)
training = [
    "accelerate>=1.0",
    "tensorboard>=2.18",
]

# Evaluation / segmentation helpers
eval = [
    "sam2>=1.0",
    "ultralytics>=8.4",
]

# Interactive visualization
viz = [
    "gradio>=6.5",
    "rerun-sdk>=0.29",
]

dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[project.scripts]
aegis-run = "aegis.pipeline.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis", "training"]

# PyTorch CUDA wheels — installed explicitly from the pytorch index.
# Run:  uv pip install torch torchvision --index https://download.pytorch.org/whl/cu128
# uv sources block below makes `uv sync` pick the right wheel automatically.
[tool.uv.sources]
torch      = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url  = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
