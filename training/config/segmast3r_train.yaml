MODEL:
  MAST3R_CKPT: /home/denis_fatykhov/Projects/segmast3r/mast3r_src/MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric.pth
  ARCH: sinkhorn

FEATURE_MATCHER:
  TYPE: Sinkhorn
  SINKHORN:
    NUM_IT: 50
    DUSTBIN_SCORE_INIT: 1.0

DATASET:
  METADATA_PATH: /mnt/vol2_raid/shared/datasets/ScanNet++/scannetpp_processed/all_metadata.npz
  DATA_ROOT:     /mnt/vol2_raid/shared/datasets/ScanNet++/scannetpp_processed
  SEGDATA_ROOT:  /mnt/vol2_raid/shared/datasets/ScanNet++/masks_resize_mast3r
  PAIRS_ROOT:    /mnt/vol2_raid/shared/datasets/ScanNet++/masks_resize_mast3r_res
  HEIGHT: 336
  WIDTH:  512
  RESIZE_MODE: square   # square | longest_side
  VAL_FRACTION: 0.02    # 2% пар уходят в val (~70K пар)

TRAINING:
  BATCH_SIZE:      12
  NUM_WORKERS:     8
  PREFETCH_FACTOR: 4
  LR:              0.0001
  WEIGHT_DECAY:    0.0001
  EPOCHS:          5
  GRAD_CLIP:       0.0
  LR_SCHEDULER:    cosine   # cosine | step | none
  WARMUP_STEPS:    500
  LOG_INTERVAL:    100      # print every N steps
  VAL_INTERVAL:    5000     # run val every N steps
  SAVE_INTERVAL:   7000     # save checkpoint every N steps

DEBUG: false
SAVE_DIR: results/segmast3r_repro
RESUME:   null             # path to checkpoint to resume from, or null

ACCELERATE:
  MIXED_PRECISION: bf16   # no | bf16 | fp16  (RTX 5090 supports bf16)
